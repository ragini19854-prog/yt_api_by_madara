kind = "web"
previewPath = "/"
title = "Madara Music"
version = "1.0.0"
id = "artifacts/madara-music"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/madara-music run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/madara-music", "run", "build" ]
publicDir = "artifacts/madara-music/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
