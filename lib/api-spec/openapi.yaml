openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Madara Music API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: music
    description: Music search and streaming
  - name: playlists
    description: Playlist management
  - name: favorites
    description: Liked songs / favorites
  - name: history
    description: Recently played history
  - name: queue
    description: Playback queue
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Music search & metadata ──────────────────────────────────────────────
  /music/search:
    get:
      operationId: searchMusic
      tags: [music]
      summary: Search for tracks via iTunes
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"

  /music/trending:
    get:
      operationId: getTrending
      tags: [music]
      summary: Get trending / featured tracks
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Trending tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"

  /music/genres:
    get:
      operationId: getGenres
      tags: [music]
      summary: Get list of music genres
      responses:
        "200":
          description: Genre list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Genre"

  /music/by-genre:
    get:
      operationId: getMusicByGenre
      tags: [music]
      summary: Get tracks by genre
      parameters:
        - name: genre
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Tracks in genre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"

  # ── Playlists ─────────────────────────────────────────────────────────────
  /playlists:
    get:
      operationId: getPlaylists
      tags: [playlists]
      summary: Get current user's playlists
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User playlists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Playlist"
    post:
      operationId: createPlaylist
      tags: [playlists]
      summary: Create a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistInput"
      responses:
        "201":
          description: Created playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"

  /playlists/{id}:
    get:
      operationId: getPlaylist
      tags: [playlists]
      summary: Get a playlist with its tracks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Playlist with tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistWithTracks"
    patch:
      operationId: updatePlaylist
      tags: [playlists]
      summary: Update a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistUpdate"
      responses:
        "200":
          description: Updated playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
    delete:
      operationId: deletePlaylist
      tags: [playlists]
      summary: Delete a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /playlists/{id}/tracks:
    post:
      operationId: addTrackToPlaylist
      tags: [playlists]
      summary: Add a track to a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistTrackInput"
      responses:
        "201":
          description: Track added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistTrack"

  /playlists/{id}/tracks/{trackId}:
    delete:
      operationId: removeTrackFromPlaylist
      tags: [playlists]
      summary: Remove a track from a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: trackId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed

  # ── Favorites ─────────────────────────────────────────────────────────────
  /favorites:
    get:
      operationId: getFavorites
      tags: [favorites]
      summary: Get liked songs for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liked tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"
    post:
      operationId: addFavorite
      tags: [favorites]
      summary: Like a track
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteInput"
      responses:
        "201":
          description: Favorited

  /favorites/{userId}/{trackId}:
    delete:
      operationId: removeFavorite
      tags: [favorites]
      summary: Unlike a track
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: trackId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed

  /favorites/check:
    get:
      operationId: checkFavorite
      tags: [favorites]
      summary: Check if a track is liked
      parameters:
        - name: trackId
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Favorite status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteStatus"

  # ── History ───────────────────────────────────────────────────────────────
  /history:
    get:
      operationId: getHistory
      tags: [history]
      summary: Get recently played tracks
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recently played tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"
    post:
      operationId: recordPlay
      tags: [history]
      summary: Record a track play
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayRecord"
      responses:
        "201":
          description: Recorded

  # ── Stats (wow endpoints) ─────────────────────────────────────────────────
  /stats/user/{userId}:
    get:
      operationId: getUserStats
      tags: [history]
      summary: Get listening stats for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Track:
      type: object
      required:
        - id
        - title
        - artist
        - thumbnail
        - previewUrl
        - duration
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        album:
          type: ["string", "null"]
        thumbnail:
          type: string
        previewUrl:
          type: string
        duration:
          type: number
        genre:
          type: ["string", "null"]

    Genre:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string

    Playlist:
      type: object
      required:
        - id
        - name
        - userId
        - isPublic
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        coverUrl:
          type: ["string", "null"]
        userId:
          type: string
        isPublic:
          type: boolean
        trackCount:
          type: integer
        createdAt:
          type: string

    PlaylistWithTracks:
      type: object
      required:
        - id
        - name
        - userId
        - isPublic
        - createdAt
        - tracks
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        coverUrl:
          type: ["string", "null"]
        userId:
          type: string
        isPublic:
          type: boolean
        createdAt:
          type: string
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"

    PlaylistInput:
      type: object
      required:
        - name
        - userId
      properties:
        name:
          type: string
        description:
          type: string
        coverUrl:
          type: string
        userId:
          type: string
        isPublic:
          type: boolean

    PlaylistUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        coverUrl:
          type: string
        isPublic:
          type: boolean

    PlaylistTrack:
      type: object
      required:
        - id
        - playlistId
        - trackId
        - addedAt
      properties:
        id:
          type: integer
        playlistId:
          type: integer
        trackId:
          type: string
        trackTitle:
          type: string
        trackArtist:
          type: string
        trackThumbnail:
          type: string
        previewUrl:
          type: string
        duration:
          type: number
        addedAt:
          type: string

    PlaylistTrackInput:
      type: object
      required:
        - trackId
        - trackTitle
        - trackArtist
        - trackThumbnail
        - previewUrl
        - duration
      properties:
        trackId:
          type: string
        trackTitle:
          type: string
        trackArtist:
          type: string
        trackThumbnail:
          type: string
        previewUrl:
          type: string
        duration:
          type: number

    FavoriteInput:
      type: object
      required:
        - userId
        - trackId
        - trackTitle
        - trackArtist
        - trackThumbnail
        - previewUrl
        - duration
      properties:
        userId:
          type: string
        trackId:
          type: string
        trackTitle:
          type: string
        trackArtist:
          type: string
        trackThumbnail:
          type: string
        previewUrl:
          type: string
        duration:
          type: number

    FavoriteStatus:
      type: object
      required:
        - isFavorite
      properties:
        isFavorite:
          type: boolean

    PlayRecord:
      type: object
      required:
        - userId
        - trackId
        - trackTitle
        - trackArtist
        - trackThumbnail
        - previewUrl
        - duration
      properties:
        userId:
          type: string
        trackId:
          type: string
        trackTitle:
          type: string
        trackArtist:
          type: string
        trackThumbnail:
          type: string
        previewUrl:
          type: string
        duration:
          type: number

    UserStats:
      type: object
      required:
        - totalPlays
        - uniqueTracks
        - playlistCount
        - favoriteCount
        - topArtists
      properties:
        totalPlays:
          type: integer
        uniqueTracks:
          type: integer
        playlistCount:
          type: integer
        favoriteCount:
          type: integer
        topArtists:
          type: array
          items:
            type: string
